services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dd-nst:latest
    container_name: dd-nst
    ports:
      - "8000:8000"
    volumes:
      # Persist generated outputs across container restarts
      - ./backend/results:/app/backend/results
      - ./backend/uploads:/app/backend/uploads
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

# ─── GPU acceleration ─────────────────────────────────────────────────────────
# This file is the CPU-only default. To enable NVIDIA GPU acceleration,
# layer the override file on top:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# See docker-compose.gpu.yml for prerequisites.
